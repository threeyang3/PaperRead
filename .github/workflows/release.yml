name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  quality-gates:
    uses: ./.github/workflows/quality-gates.yml

  release:
    needs: quality-gates
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate tag, versions, licence and main ancestry
        shell: bash
        run: |
          test ! -e LICENSE-TODO.md
          python scripts/check_versions.py
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paperflow-release-dist
          path: dist
      - name: Verify SHA256SUMS covers every release artifact
        shell: python
        run: |
          import hashlib, pathlib
          root = pathlib.Path("dist")
          sums = root / "SHA256SUMS"
          assert sums.is_file()
          entries = {}
          for line in sums.read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              entries[name] = digest
          files = {path.name for path in root.iterdir() if path.is_file() and path.name != "SHA256SUMS"}
          assert files == set(entries), (sorted(files - set(entries)), sorted(set(entries) - files))
          for name, expected in entries.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual == expected, name
      - name: Create draft release and upload all artifacts
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
      - name: Verify uploaded assets before publishing draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > uploaded.txt
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > expected.txt
          diff -u expected.txt uploaded.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false
