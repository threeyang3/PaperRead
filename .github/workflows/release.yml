name: Release
on:
  push:
    tags: ["v*.*.*"]
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require selected licences
        shell: pwsh
        run: |
          if (Test-Path LICENSE-TODO.md) {
            throw "Release blocked: select software and data licences first."
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_versions.py
      - run: python -m pytest
      - run: python scripts/build_release.py
      - run: python -m pytest tests/packaging -q
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: dist/*
