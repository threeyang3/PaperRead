name: PaperFlow quality gates

on:
  workflow_call:
    inputs:
      full:
        description: Run the full release and compatibility matrix
        type: boolean
        default: true
      docs-only:
        description: Validate documentation shipped in release archives
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  dependency-compatibility:
    needs: quality
    if: inputs.full || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        mode: [locked, latest-compatible]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/release-py*.txt
      - name: Install locked dependency graph
        if: matrix.mode == 'locked'
        run: |
          pyver="${{ matrix.python }}"
          lock="requirements/release-py${pyver/./}.txt"
          python -m pip install --require-hashes -r "$lock"
          python -m pip install --no-deps -e .
      - name: Install latest compatible dependency graph
        if: matrix.mode == 'latest-compatible'
        run: python -m pip install --upgrade -e ".[dev,quality,browser]"
      - run: python -m pytest tests/feed tests/unit/test_pdf_resolver.py tests/unit/test_zotero_core_service.py

  python-tests:
    needs: quality
    if: inputs.full || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/release-py*.txt
      - name: Install locked dependencies
        shell: bash
        run: |
          pyver="${{ matrix.python }}"
          lock="requirements/release-py${pyver/./}.txt"
          python -m pip install --require-hashes -r "$lock"
          python -m pip install --no-deps -e .
      - run: python -m pytest

  node-integrations:
    if: ${{ !inputs.docs-only }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.full || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node tests/integration/test_scheduler_core.js
      - run: node tests/integration/test_automation_plugin_lifecycle.js
      - run: node tests/integration/test_zotero_core_client.js
      - run: node tests/integration/test_zotero_plugin_api.js
      - run: node tests/integration/test_zotero_ui.js

  quality:
    if: ${{ !inputs.docs-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/release-py*.txt
      - run: python -m pip install --require-hashes -r requirements/release-py313.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/paperflow
      - run: python scripts/check_versions.py
      - run: python -m pytest --cov=paperflow --cov-report=term-missing --cov-report=json
      - run: python scripts/check_coverage.py coverage.json
      - run: pip-audit -r requirements/release-py313.txt

  release-build:
    needs: quality
    if: inputs.full || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/release-py*.txt
      - run: python -m pip install --require-hashes -r requirements/release-py312.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/check_versions.py
      - run: python scripts/build_release.py
      - run: python -m pytest tests/packaging -q
      - name: Install built wheel and smoke-test console script
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\paperflow-wheel-smoke"
          $python = "$env:RUNNER_TEMP\paperflow-wheel-smoke\Scripts\python.exe"
          & $python -m pip install (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          $paperflow = "$env:RUNNER_TEMP\paperflow-wheel-smoke\Scripts\paperflow.exe"
          & $paperflow --version
          & $paperflow --help
          & $paperflow init --non-interactive --vault "$env:RUNNER_TEMP\PaperFlow 测试库"
          & $paperflow workspace info --vault "$env:RUNNER_TEMP\PaperFlow 测试库"
          $previousNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          $doctor = & $paperflow doctor --vault "$env:RUNNER_TEMP\PaperFlow 测试库" 2>&1
          $doctorExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $previousNativePreference
          if ($doctorExit -notin @(0, 1)) { throw "doctor crashed: $doctor" }
          if (-not ($doctor | Select-String "Workspace schema")) { throw "doctor output incomplete" }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paperflow-release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  documentation-package:
    if: inputs.docs-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/release-py312.txt
      - run: python -m pip install --require-hashes -r requirements/release-py312.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/check_versions.py
      - run: python scripts/build_release.py
      - run: python -m pytest tests/packaging -q
