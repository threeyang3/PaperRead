name: Build
on:
  push:
  pull_request:
env:
  PYTHONUTF8: "1"
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build hatchling pytest
      - run: python scripts/build_release.py
      - name: Audit release artifacts
        run: python -m pytest tests/packaging -q
      - name: Install built wheel
        shell: pwsh
        run: python -m pip install --force-reinstall (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
      - run: paperflow --help
      - uses: actions/upload-artifact@v4
        with:
          name: paperflow-dist
          path: dist/
