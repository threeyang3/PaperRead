name: CI
on:
  push:
  pull_request:
jobs:
  dependency-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [locked, latest-compatible]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.mode == 'locked'
        run: python -m pip install -c constraints/release.txt -e ".[dev]"
      - if: matrix.mode == 'latest-compatible'
        run: python -m pip install --upgrade -e ".[dev]"
      - run: python -m pytest tests/feed tests/unit/test_pdf_resolver.py tests/unit/test_zotero_core_service.py
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,quality]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/paperflow
      - run: python scripts/check_versions.py
      - run: python -m pytest --cov=paperflow --cov-report=term-missing --cov-report=json
      - run: python scripts/check_coverage.py coverage.json
      - run: pip-audit -r constraints/release.txt
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit tests/integration tests/path
      - run: node tests/integration/test_scheduler_core.js
      - run: node tests/integration/test_automation_plugin_lifecycle.js
      - run: node tests/integration/test_zotero_core_client.js
      - run: node tests/integration/test_zotero_plugin_api.js
      - run: node tests/integration/test_zotero_ui.js
      - name: Secret and private-data scan
        shell: python
        run: |
          import pathlib, re
          banned = re.compile(r'(?i)(auth\.json|\.paperflow/data/papers|USER_NOTES_START)')
          bad = [str(p) for p in pathlib.Path("src").rglob("*") if p.is_file() and banned.search(str(p))]
          assert not bad, bad
