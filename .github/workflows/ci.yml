name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit tests/integration tests/path
      - run: node tests/integration/test_scheduler_core.js
      - name: Secret and private-data scan
        shell: python
        run: |
          import pathlib, re
          banned = re.compile(r'(?i)(auth\.json|\.paperflow/data/papers|USER_NOTES_START)')
          bad = [str(p) for p in pathlib.Path("src").rglob("*") if p.is_file() and banned.search(str(p))]
          assert not bad, bad
