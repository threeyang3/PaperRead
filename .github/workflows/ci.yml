name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      full: ${{ steps.scope.outputs.full }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test CI scope rules
        run: python3 .github/test_ci_scope.py
      - id: scope
        name: Select checks from the complete change set
        run: python3 .github/ci_scope.py
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  quality-gates:
    needs: scope
    if: needs.scope.outputs.code == 'true' || needs.scope.outputs.docs == 'true'
    uses: ./.github/workflows/quality-gates.yml
    with:
      full: ${{ needs.scope.outputs.full == 'true' }}
      docs-only: ${{ needs.scope.outputs.docs == 'true' }}
