name: Refresh vulnerable release locks (one-shot)

on:
  push:
    branches:
      - maintenance/refresh-vulnerable-locks-20261113
    paths:
      - .github/workflows/refresh-security-locks.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'threeyang3/PaperRead'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install lockfile tool
        run: python -m pip install 'uv>=0.9,<1'
      - name: Regenerate only audited packages with proper cross-platform hashes
        shell: bash
        run: |
          set -euo pipefail
          for python_version in 3.11 3.12 3.13; do
            suffix="${python_version//./}"
            uv pip compile pyproject.toml \
              --extra dev \
              --extra quality \
              --extra browser \
              --python-version "$python_version" \
              --generate-hashes \
              --upgrade-package 'msgpack==1.2.3' \
              --upgrade-package 'certifi==2026.10.18' \
              --upgrade-package 'filelock==4.2.1' \
              --upgrade-package 'urllib3==2.8.0' \
              --output-file "requirements/release-py{suffix}.txt"
          done
      - name: Commit generated lockfiles to maintenance branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -- requirements/release-py311.txt requirements/release-py312.txt requirements/release-py313.txt
          if git diff --cached --quiet; then
            echo "No lock updates needed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: refresh audited dependency lock versions"
          git push origin HEAD:maintenance/refresh-vulnerable-locks-20261113
