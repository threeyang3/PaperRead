[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperflow"
version = "1.3.2"
description = "Local-first, installable AI paper learning workflow for Obsidian"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.12",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "jsonschema>=4.26.0",
  "packaging>=26.2",
  "pydantic>=2.13.4",
  "pymupdf>=1.28.0",
  "ruamel.yaml>=0.19.1",
  "typer>=0.27.0",
  "tzdata>=2026.3; platform_system == 'Windows'",
  "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = ["build>=1.5.0", "pytest>=9.1.1", "respx>=0.23.1"]

[project.scripts]
paperflow = "paperflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paperflow"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "paperflow/resources/schemas"
"templates" = "paperflow/resources/templates"
"integrations" = "paperflow/resources/integrations"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/schemas",
  "/templates",
  "/integrations",
  "/migrations",
  "/examples",
  "/scripts",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE*",
  "/pyproject.toml",
]
exclude = [
  "/.paperflow/data",
  "/.paperflow/state",
  "/.paperflow/backups",
  "/10 Papers",
  "/40 Daily Briefs",
  "/50 Inbox",
  "/80 Attachments",
]

[tool.pytest.ini_options]
testpaths = ["tests", ".paperflow/tests"]
addopts = "-q -p no:cacheprovider"
