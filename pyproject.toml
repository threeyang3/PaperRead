[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperflow"
dynamic = ["version"]
description = "Local-first, installable AI paper learning workflow for Obsidian"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "packaging>=24",
  "pydantic>=2.8",
  "pymupdf>=1.24",
  "ruamel.yaml>=0.18",
  "typer>=0.27.0",
  "tzdata>=2025.2; platform_system == 'Windows'",
  "zstandard>=0.23",
]

[project.optional-dependencies]
dev = ["build>=1.2", "hatchling>=1.27", "pytest>=8.3", "respx>=0.21"]
quality = [
  "mypy>=1.15",
  "pip-audit>=2.9",
  "pytest-cov>=6.1",
  "ruff>=0.11",
]
browser = ["playwright>=1.52"]

[project.scripts]
paperflow = "paperflow.cli:app"

[tool.hatch.version]
path = "src/paperflow/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/paperflow"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "paperflow/resources/schemas"
"templates" = "paperflow/resources/templates"
"integrations" = "paperflow/resources/integrations"
"prompts" = "paperflow/resources/prompts"
"taxonomy" = "paperflow/resources/taxonomy"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/schemas",
  "/templates",
  "/integrations",
  "/prompts",
  "/taxonomy",
  "/migrations",
  "/examples",
  "/scripts",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE*",
  "/pyproject.toml",
]
exclude = [
  "/.paperflow/data",
  "/.paperflow/state",
  "/.paperflow/backups",
  "/10 Papers",
  "/40 Daily Briefs",
  "/50 Inbox",
  "/80 Attachments",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.coverage.report]
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs/archive", "dist"]
include = [
  "scripts/build_release.py",
  "scripts/check_coverage.py",
  "src/paperflow/clock.py",
  "src/paperflow/data/records.py",
  "src/paperflow/data/store.py",
  "src/paperflow/doctor.py",
  "src/paperflow/ai/chatgpt_web_adapter.py",
  "src/paperflow/community/publisher.py",
  "src/paperflow/community/subscriber.py",
  "src/paperflow/feed/publisher.py",
  "src/paperflow/feed/subscriber.py",
  "src/paperflow/pdf_resolver.py",
  "src/paperflow/security/artifacts.py",
  "src/paperflow/security/paths.py",
  "src/paperflow/pipeline/daily_brief.py",
  "src/paperflow/pipeline/visuals.py",
  "src/paperflow/utils.py",
  "src/paperflow/zotero/core_service.py",
  "src/paperflow/zotero/mapping.py",
  "src/paperflow/zotero/mapping_index.py",
  "src/paperflow/zotero/migration.py",
  "src/paperflow/zotero/standalone_sync.py",
  "tests/feed/test_release_hardening.py",
  "tests/feed/test_streaming_pdf_download.py",
  "tests/packaging/test_offline_installer.py",
  "tests/unit/test_data_release_hardening.py",
  "tests/unit/test_pdf_resolver.py",
  "tests/unit/test_timezone.py",
  "tests/unit/test_zotero_core_lifecycle.py",
  "tests/unit/test_zotero_mapping_index.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.format]
exclude = [
  "scripts/build_release.py",
  "src/paperflow/data/records.py",
  "src/paperflow/data/store.py",
  "src/paperflow/doctor.py",
  "src/paperflow/ai/chatgpt_web_adapter.py",
  "src/paperflow/community/publisher.py",
  "src/paperflow/community/subscriber.py",
  "src/paperflow/feed/publisher.py",
  "src/paperflow/feed/subscriber.py",
  "src/paperflow/pipeline/daily_brief.py",
  "src/paperflow/pipeline/visuals.py",
  "src/paperflow/utils.py",
  "src/paperflow/security/artifacts.py",
  "src/paperflow/zotero/core_service.py",
  "src/paperflow/zotero/mapping.py",
  "src/paperflow/zotero/migration.py",
  "src/paperflow/zotero/standalone_sync.py",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["src/paperflow/resources/"]

[[tool.mypy.overrides]]
module = ["paperflow.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "paperflow.ai.chatgpt_web_adapter",
  "paperflow.clock",
  "paperflow.community.publisher",
  "paperflow.community.subscriber",
  "paperflow.data.records",
  "paperflow.data.store",
  "paperflow.feed.publisher",
  "paperflow.feed.subscriber",
  "paperflow.pdf_resolver",
  "paperflow.security.artifacts",
  "paperflow.security.paths",
  "paperflow.zotero.core_service",
  "paperflow.zotero.mapping_index",
]
ignore_errors = false
